[project]
name = "chinext-quant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "tushare>=1.4.29",
    "pandas>=3.0",
    "numpy>=2.4",
    "torch>=2.0",
    "wandb>=0.19",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyarrow>=23.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=7.0"]
