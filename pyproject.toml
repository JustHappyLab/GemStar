[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chinext-quant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "tushare>=1.4.29",
    "pandas>=3.0",
    "numpy>=2.4",
    "torch>=2.0",
    "swanlab>=0.7",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
gemstar = "src.cli.app:app"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
