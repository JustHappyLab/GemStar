<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#39ff14;stop-opacity:0.2"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00e5ff" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffab00" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff5f57" opacity="0.6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="#0a0a0f"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e2e" stroke-width="0.5"/>
  </pattern>
  <rect width="1000" height="500" fill="url(#grid)" opacity="0.3"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#00e5ff" font-size="18" font-weight="700">GemStar Daily Pipeline Flow</text>
  <text x="500" y="60" text-anchor="middle" fill="#55556a" font-size="10">FSM-driven, each trading day executes the full research cycle</text>

  <!-- ─── Main Pipeline (horizontal) ─── -->
  <g transform="translate(30, 90)">
    <!-- Phase 1: Data -->
    <rect x="0" y="0" width="110" height="60" rx="10" fill="#111119" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="55" y="22" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="600">COLLECTING</text>
    <text x="55" y="38" text-anchor="middle" fill="#55556a" font-size="7">Tushare API</text>
    <text x="55" y="50" text-anchor="middle" fill="#55556a" font-size="7">Parquet cache</text>

    <line x1="110" y1="30" x2="140" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 2: Quality -->
    <rect x="140" y="0" width="110" height="60" rx="10" fill="#111119" stroke="#ffab00" stroke-opacity="0.4"/>
    <text x="195" y="22" text-anchor="middle" fill="#ffab00" font-size="9" font-weight="600">QUALITY_CHECK</text>
    <text x="195" y="38" text-anchor="middle" fill="#55556a" font-size="7">DataQualityGate</text>
    <text x="195" y="50" text-anchor="middle" fill="#55556a" font-size="7">pass / degraded / abort</text>

    <line x1="250" y1="30" x2="280" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 3: Factor Monitor -->
    <rect x="280" y="0" width="110" height="60" rx="10" fill="#111119" stroke="#39ff14" stroke-opacity="0.4"/>
    <text x="335" y="22" text-anchor="middle" fill="#39ff14" font-size="9" font-weight="600">FACTOR_MONITOR</text>
    <text x="335" y="38" text-anchor="middle" fill="#55556a" font-size="7">IC/IR analysis</text>
    <text x="335" y="50" text-anchor="middle" fill="#55556a" font-size="7">FactorHealthMonitor</text>

    <line x1="390" y1="30" x2="420" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 4: Strategy Ideation -->
    <rect x="420" y="0" width="140" height="60" rx="10" fill="#111119" stroke="#ffab00" stroke-opacity="0.4"/>
    <text x="490" y="18" text-anchor="middle" fill="#ffab00" font-size="9" font-weight="600">STRATEGY_IDEATION</text>
    <text x="490" y="34" text-anchor="middle" fill="#55556a" font-size="7">macro_analyst</text>
    <text x="490" y="46" text-anchor="middle" fill="#55556a" font-size="7">event_scanner + research</text>

    <line x1="560" y1="30" x2="590" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 5: Validation + Backtest -->
    <rect x="590" y="0" width="140" height="60" rx="10" fill="#111119" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="660" y="18" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="600">BACKTESTING</text>
    <text x="660" y="34" text-anchor="middle" fill="#55556a" font-size="7">validate → backtest</text>
    <text x="660" y="46" text-anchor="middle" fill="#55556a" font-size="7">T+1, limit up/down</text>

    <line x1="730" y1="30" x2="760" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 6: Judge + Review -->
    <rect x="760" y="0" width="110" height="60" rx="10" fill="#111119" stroke="#39ff14" stroke-opacity="0.4"/>
    <text x="815" y="22" text-anchor="middle" fill="#39ff14" font-size="9" font-weight="600">JUDGING</text>
    <text x="815" y="38" text-anchor="middle" fill="#55556a" font-size="7">5 hard gates</text>
    <text x="815" y="50" text-anchor="middle" fill="#55556a" font-size="7">+ LLM review</text>

    <line x1="870" y1="30" x2="900" y2="30" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Phase 7: Report -->
    <rect x="900" y="0" width="70" height="60" rx="10" fill="#111119" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="935" y="22" text-anchor="middle" fill="#00e5ff" font-size="9" font-weight="600">REPORT</text>
    <text x="935" y="38" text-anchor="middle" fill="#55556a" font-size="7">leaderboard</text>
    <text x="935" y="50" text-anchor="middle" fill="#55556a" font-size="7">+ daily report</text>
  </g>

  <!-- ─── Feedback Loop: Strategy Retry ─── -->
  <g transform="translate(30, 180)">
    <text x="0" y="15" fill="#ffab00" font-size="11" font-weight="600">Feedback Loop: Iterative Strategy Generation</text>

    <!-- Loop diagram -->
    <rect x="0" y="30" width="200" height="50" rx="8" fill="#111119" stroke="#ffab00" stroke-opacity="0.3"/>
    <text x="100" y="50" text-anchor="middle" fill="#e8e8ed" font-size="9">generate_tickets</text>
    <text x="100" y="66" text-anchor="middle" fill="#55556a" font-size="7">LLM → ResearchTicket[]</text>

    <line x1="200" y1="55" x2="250" y2="55" stroke="#ffab00" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>

    <rect x="250" y="30" width="180" height="50" rx="8" fill="#111119" stroke="#ffab00" stroke-opacity="0.3"/>
    <text x="340" y="50" text-anchor="middle" fill="#e8e8ed" font-size="9">draft_strategy</text>
    <text x="340" y="66" text-anchor="middle" fill="#55556a" font-size="7">LLM → Strategy YAML</text>

    <line x1="430" y1="55" x2="480" y2="55" stroke="#ffab00" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>

    <rect x="480" y="30" width="160" height="50" rx="8" fill="#111119" stroke="#00e5ff" stroke-opacity="0.3"/>
    <text x="560" y="50" text-anchor="middle" fill="#e8e8ed" font-size="9">validate + backtest</text>
    <text x="560" y="66" text-anchor="middle" fill="#55556a" font-size="7">engine constraints</text>

    <line x1="640" y1="55" x2="690" y2="55" stroke="#ffab00" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>

    <rect x="690" y="30" width="140" height="50" rx="8" fill="#111119" stroke="#39ff14" stroke-opacity="0.3"/>
    <text x="760" y="50" text-anchor="middle" fill="#e8e8ed" font-size="9">judge (5 gates)</text>
    <text x="760" y="66" text-anchor="middle" fill="#55556a" font-size="7">Sharpe ≥ 1.0 ...</text>

    <!-- Reject loop back -->
    <path d="M 760 80 L 760 100 L 100 100 L 100 80" fill="none" stroke="#ff5f57" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#arrowhead-red)"/>
    <text x="430" y="114" text-anchor="middle" fill="#ff5f57" font-size="8">rejected → regenerate tickets (loop until enough candidates)</text>
  </g>

  <!-- ─── Incident FSM ─── -->
  <g transform="translate(30, 320)">
    <text x="0" y="15" fill="#00e5ff" font-size="11" font-weight="600">IncidentFSM — 7 State Self-Healing</text>

    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#111119" stroke="#ffab00" stroke-opacity="0.4"/>
      <text x="50" y="22" text-anchor="middle" fill="#ffab00" font-size="8">DETECTED</text>

      <line x1="100" y1="18" x2="130" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="130" y="0" width="110" height="36" rx="6" fill="#111119" stroke="#00e5ff" stroke-opacity="0.4"/>
      <text x="185" y="22" text-anchor="middle" fill="#00e5ff" font-size="8">CLASSIFIED</text>

      <line x1="240" y1="18" x2="270" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="270" y="0" width="100" height="36" rx="6" fill="#111119" stroke="#39ff14" stroke-opacity="0.4"/>
      <text x="320" y="22" text-anchor="middle" fill="#39ff14" font-size="8">RETRYING</text>

      <line x1="370" y1="18" x2="400" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="400" y="0" width="100" height="36" rx="6" fill="#111119" stroke="#ffab00" stroke-opacity="0.4"/>
      <text x="450" y="22" text-anchor="middle" fill="#ffab00" font-size="8">DEGRADED</text>

      <line x1="500" y1="18" x2="530" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="530" y="0" width="100" height="36" rx="6" fill="#111119" stroke="#ff5f57" stroke-opacity="0.4"/>
      <text x="580" y="22" text-anchor="middle" fill="#ff5f57" font-size="8">MANUAL</text>

      <line x1="630" y1="18" x2="660" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="660" y="0" width="110" height="36" rx="6" fill="#111119" stroke="#39ff14" stroke-opacity="0.4"/>
      <text x="715" y="22" text-anchor="middle" fill="#39ff14" font-size="8">ENGINEERING</text>

      <line x1="770" y1="18" x2="800" y2="18" stroke="#55556a" stroke-width="1" marker-end="url(#arrowhead)"/>

      <rect x="800" y="0" width="100" height="36" rx="6" fill="#111119" stroke="#00e5ff" stroke-opacity="0.4"/>
      <text x="850" y="22" text-anchor="middle" fill="#00e5ff" font-size="8">RESOLVED</text>

      <!-- Retry loop -->
      <path d="M 320 36 L 320 56 L 185 56 L 185 36" fill="none" stroke="#39ff14" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4"/>
      <text x="252" y="52" text-anchor="middle" fill="#39ff14" font-size="7">retry loop</text>
    </g>
  </g>

  <!-- ─── Legend ─── -->
  <g transform="translate(30, 440)">
    <text x="0" y="15" fill="#55556a" font-size="9">Color: </text>
    <rect x="45" y="5" width="12" height="12" rx="3" fill="#00e5ff" opacity="0.3"/>
    <text x="62" y="15" fill="#55556a" font-size="9">Data/Engine</text>
    <rect x="140" y="5" width="12" height="12" rx="3" fill="#ffab00" opacity="0.3"/>
    <text x="157" y="15" fill="#55556a" font-size="9">LLM Analysis</text>
    <rect x="260" y="5" width="12" height="12" rx="3" fill="#39ff14" opacity="0.3"/>
    <text x="277" y="15" fill="#55556a" font-size="9">Evaluation</text>
    <rect x="360" y="5" width="12" height="12" rx="3" fill="#ff5f57" opacity="0.3"/>
    <text x="377" y="15" fill="#55556a" font-size="9">Error/Manual</text>
  </g>
</svg>
